name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          SDKM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n1)"
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerKeeperWhitelist-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
